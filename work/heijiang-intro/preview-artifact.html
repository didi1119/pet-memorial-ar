<title>黑醬開場短片</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400&display=swap">
<style>
/* 版面：單一紙色主題（與黑醬網站一致），開場覆蓋在上，底下是結尾卡。 */
:root{color-scheme:light;--paper:#f4f0e9;--ink:#483d35;--warm:#886955;--quiet:#8b7d71;--line:#dcd2c6;--serif:"Songti TC","Noto Serif TC","PMingLiU",serif;--body:"PingFang TC","Microsoft JhengHei",sans-serif}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--body);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 85% 0,#fff9eb80,transparent 55%),radial-gradient(ellipse at 0 65%,#e6d9c829,transparent 60%);z-index:-1}
main{max-width:520px;margin:auto;padding-block:48px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:100%;box-sizing:border-box;justify-content:center}
.mark{width:72px;height:72px;border-radius:18px;box-shadow:0 1px 0 #fff,0 10px 30px #5a453820}
h1{font:400 28px/1.6 var(--serif);letter-spacing:.08em;margin:8px 0 0;text-wrap:balance}
p{color:#7e7165;font-size:13px;letter-spacing:.05em;margin:0;max-width:34em}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.quiet-button,.link{font:13px var(--body);color:var(--warm);border:1px solid var(--line);border-radius:100px;background:transparent;min-height:44px;padding:10px 20px;cursor:pointer;letter-spacing:.06em;text-decoration:none;display:inline-flex;align-items:center}
.quiet-button:hover,.link:hover{background:#e9dfd23b}
:focus-visible{outline:2px solid #99795d;outline-offset:5px}
.fine{font-size:11px;color:var(--quiet);margin-top:22px}
/* 黑醬・在身邊 — 開場短片 */
html.intro-open{overflow:hidden}
html.intro-open main{visibility:hidden}
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--paper,#f4f0e9);color:var(--ink,#483d35);display:flex;align-items:center;justify-content:center;transition:opacity 1.5s ease}
#intro.leaving{opacity:0;pointer-events:none}
#intro [hidden]{display:none!important}

/* 入口 */
.intro-gate{display:flex;flex-direction:column;align-items:center;gap:26px;padding:32px;text-align:center;animation:intro-arrive 1.1s both}
.gate-mark{width:46px;height:46px;stroke:var(--warm,#886955);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.gate-button{display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line,#dcd2c6);background:transparent;color:inherit;border-radius:100px;padding:22px 44px;cursor:pointer;font:400 20px/1.4 var(--serif,"Songti TC","Noto Serif TC",serif);letter-spacing:.14em;transition:background .25s,transform .25s;-webkit-tap-highlight-color:transparent}
.gate-button:hover{background:#e9dfd23b;transform:translateY(-1px)}
.gate-button small{font:12px/1.5 var(--body,"PingFang TC",sans-serif);letter-spacing:.08em;color:var(--quiet,#8b7d71)}
.gate-skip{border:0;background:transparent;color:var(--quiet,#8b7d71);font:12px var(--body,"PingFang TC",sans-serif);letter-spacing:.1em;cursor:pointer;padding:12px;text-decoration:underline;text-decoration-color:#ccb9a6;text-underline-offset:5px}

/* 舞台 */
.intro-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.film{flex:1;width:100%;min-height:0;display:block;overflow:visible}
.scene{opacity:0;transition:opacity .7s ease;pointer-events:none}
.scene.active{opacity:1}
.sr-caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.caption{font:400 19px var(--serif,"Songti TC","Noto Serif TC",serif);letter-spacing:.14em;fill:var(--ink,#483d35);paint-order:stroke;stroke:var(--paper,#f4f0e9);stroke-width:7px;stroke-linejoin:round;stroke-opacity:.85;opacity:0;transform:translateY(5px);transition:opacity .7s ease,transform .7s ease}
.caption.show{opacity:1;transform:none}
.title{opacity:0;transition:opacity 1.6s ease}
.title.show{opacity:1}
.title text{font:400 30px var(--serif,"Songti TC","Noto Serif TC",serif);letter-spacing:.2em;fill:var(--ink,#483d35)}
.title .title-sub{font:12px var(--body,"PingFang TC",sans-serif);letter-spacing:.16em;fill:var(--quiet,#8b7d71)}
.intro-skip{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));border:0;background:#f4f0e9b8;color:var(--quiet,#8b7d71);font:12px var(--body,"PingFang TC",sans-serif);letter-spacing:.1em;padding:10px 14px;border-radius:100px;cursor:pointer;opacity:0;animation:intro-arrive .8s 2.5s both}

/* 第一幕：夜裡的紙箱 */
.stars circle{animation:twinkle 3s ease-in-out infinite}
.stars circle:nth-child(2n){animation-delay:-1.2s}.stars circle:nth-child(3n){animation-delay:-2.1s}
.scene.active .breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:0 0}

/* 第二幕：捧起來 */
.scene.active .lift{animation:lift 3.6s ease-out both}
.scene.active .peek{animation:peek 2.4s .9s ease-out both}
.scene.active .peek .eyes{animation:blink 2.4s .9s ease-out both;transform-origin:24px -50px}

/* 第三幕：另一雙手 */
.scene.active .reach{animation:reach 2.2s .3s ease-out both}
.scene.active .look{animation:look 2.4s 1s ease-in-out both;transform-origin:24px -48px}

/* 第四幕：長大了 */
.scene.active .grow{animation:grow 2.6s ease-in-out both;transform-origin:0 0}
.scene.active .knead .paw-a{animation:knead 1.1s ease-in-out infinite;transform-origin:31px -46px}
.scene.active .knead .paw-b{animation:knead 1.1s -.55s ease-in-out infinite;transform-origin:53px -46px}
.scene.active .loaf{animation:settle 2.2s ease-out both}
.scene.active .yawn .head{animation:yawn 2.3s ease-in-out both;transform-origin:50px -90px}

/* 第五幕：那一天 */
.scene.active .held-cat{animation:sway 3.6s ease-in-out infinite;transform-origin:0 -40px}
.bunting{animation:bunting 4s ease-in-out infinite;transform-origin:180px 70px}

/* 日常：踩肚子、等門、鍵盤、領巾 */
.scene.active .stomp{animation:stomp 3.4s ease-in-out both}
.arrive-a,.arrive-b{opacity:0}
.scene.active .arrive-a{animation:arrive-door .9s .3s ease-out both}
.scene.active .arrive-b{animation:arrive-door .9s .6s ease-out both}
.scene.active .back-cat.turned{animation-delay:0s;animation-duration:.4s}
.scene.active .turned .head-back{animation-delay:1.6s;animation-duration:.25s}
.scene.active .turned .head-turn{animation-delay:1.6s;animation-duration:.25s}
.heart{opacity:0;transform-box:fill-box;transform-origin:center}
.scene.active .h1{animation:heart 2.4s 1.9s ease-out both}
.scene.active .h2{animation:heart 2.4s 2.4s ease-out both}
.scene.active .h3{animation:heart 3s 4.4s ease-out both}
.scene.active .h4{animation:heart 3s 5s ease-out both}
.scene.active .tea{animation:tea 1.2s .4s ease-out both}
.steam{animation:steam 2.4s ease-in-out infinite}
.scene.active .keyboard-cat{animation:breathe-s 3.2s ease-in-out infinite;transform-origin:0 0}
.scene.active .sit{animation:sit 3.4s ease-in-out infinite;transform-origin:0 0}
.scene.active .bandana{animation:bandana 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.ghost{opacity:0}
.scene.active .ghost{animation:fade-in 2s 3.4s ease both}

/* 第六幕：空的紙箱，一道光 */
.scene.active .beam{animation:beam 4s ease-out both;transform-origin:360px 0}
.motes circle{animation:drift 6s ease-in-out infinite}
.motes circle:nth-child(2n){animation-delay:-2s}.motes circle:nth-child(3n){animation-delay:-4s;animation-duration:7.5s}

/* 第七幕：回頭看一眼 */
.paw-print{opacity:0;transform-box:fill-box;transform-origin:center}
.scene.active .paw-print{animation:print .5s ease-out both}
.scene.active .p1{animation-delay:.25s}.scene.active .p2{animation-delay:.5s}.scene.active .p3{animation-delay:.75s}.scene.active .p4{animation-delay:1s}.scene.active .p5{animation-delay:1.25s}.scene.active .p6{animation-delay:1.5s}.scene.active .p7{animation-delay:1.75s}
.back-cat{opacity:0}
.scene.active .back-cat{animation:intro-arrive 1s 1.5s both}
.head-turn{opacity:0}
.scene.active .head-back{animation:fade-out .5s 2.6s both}
.scene.active .head-turn{animation:fade-in .5s 2.6s both}

@keyframes intro-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:translate(0,-4px) scale(1,1)}50%{transform:translate(0,-6px) scale(1.015,1.04)}}
@keyframes lift{from{transform:translate(180px,400px)}to{transform:translate(180px,340px)}}
@keyframes peek{from{transform:translate(0,10px)}to{transform:translate(0,-14px)}}
@keyframes blink{0%,40%{transform:scaleY(.1)}60%{transform:scaleY(1)}70%{transform:scaleY(.2)}80%,100%{transform:scaleY(1)}}
@keyframes reach{from{transform:translate(70px,-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes look{from{transform:translate(0,-6px) rotate(0)}to{transform:translate(6px,-10px) rotate(-10deg)}}
@keyframes grow{from{transform:translate(170px,392px) scale(.55)}to{transform:translate(170px,392px) scale(1)}}
@keyframes knead{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes settle{from{transform:translate(4px,8px) scale(1,.96)}to{transform:translate(4px,-2px) scale(1,1)}}
@keyframes yawn{0%{transform:rotate(0)}35%{transform:rotate(-14deg) translate(2px,-4px)}75%{transform:rotate(-14deg) translate(2px,-4px)}100%{transform:rotate(0)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:translate(0,4px) rotate(1.5deg)}}
@keyframes bunting{0%,100%{transform:skewX(0)}50%{transform:skewX(1.2deg)}}
@keyframes beam{from{opacity:0;transform:rotate(-4deg)}to{opacity:1;transform:rotate(0)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,14px)}}
@keyframes stomp{0%{transform:translate(60px,12px) scale(.62)}50%{transform:translate(44px,12px) scale(.62)}100%{transform:translate(50px,12px) scale(.62)}}
@keyframes arrive-door{from{opacity:0;transform:translate(40px,0)}to{opacity:1;transform:none}}
@keyframes heart{0%{opacity:0;transform:translate(0,8px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(0,-26px) scale(1)}}
@keyframes tea{from{opacity:0;transform:translate(-30px,0)}to{opacity:1;transform:none}}
@keyframes steam{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(0,-4px);opacity:.2}}
@keyframes breathe-s{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.03)}}
@keyframes sit{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes bandana{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes print{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion:reduce){.scene,.scene *{animation:none!important}}

/* 頁面上的「再看一次開場」 */
.intro-replay{display:block;margin:26px auto 0}
</style>
<script>try{document.documentElement.classList.add('intro-open');setTimeout(function(){if(!document.getElementById('intro'))document.documentElement.classList.remove('intro-open')},4000)}catch(e){}</script>

  // 一雙手，從下方捧著（以粗線條畫手臂，指頭扶在箱子前面）。座標與紙箱同一組。
  function hands() {
    const skin = '#f0dfcc';

    return `<g class="hands">
      ${arm('M-215 330 C-170 250 -120 160 -62 84')}
      ${arm('M215 330 C170 250 120 160 62 84')}

  // 另一雙手，從右上伸過來，停在小貓頭前。絕對座標。
  function reachingHand() {

  // 琦琦與蓓蓓。hair: 'long'（長髮、瀏海、珍珠耳環）或 'short'（短髮）。原點在脖子底。
  // outfit: 'day'（日常）、'wedding'（白紗／背心）、'sleep'。eyes: 'happy' | 'dot' | 'shut'

    const hairBack = hair === 'long'
      ? `<path d="M-33 -50 C-33 -78 33 -78 33 -50 L37 14 C22 22 -22 22 -37 14 Z" fill="${HAIR}" ${stroke}/>` : '';
    const hairFront = hair === 'long'

    if (outfit === 'wedding' && hair === 'long') {

    }
    const fullBody = body === 'full'
      ? (hair === 'long'
        ? `<path d="M-30 36 L-46 150 L46 150 L30 36 Z" fill="${outfit === 'wedding' ? '#fbf8f3' : '#e9c9c0'}" ${stroke}/>`

      : '';
    return `<g class="person ${cls}">

  function makePiano(ctx) {
    const master = ctx.createGain();
    master.gain.value = 0;
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = 3200; tone.Q.value = .4;
    const delay = ctx.createDelay(1.0); delay.delayTime.value = .34;
    const feedback = ctx.createGain(); feedback.gain.value = .22;
    const wet = ctx.createGain(); wet.gain.value = .22;
    const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1800;
    tone.connect(master);
    tone.connect(delay); delay.connect(damp); damp.connect(feedback); feedback.connect(delay); damp.connect(wet); wet.connect(master);
    master.connect(ctx.destination);
    function note(when, midi, dur, vel) {
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vel, when + .012);
      g.gain.exponentialRampToValueAtTime(vel * .45, when + .35);
      g.gain.exponentialRampToValueAtTime(Math.max(vel * .12, .0002), when + dur);
      g.gain.exponentialRampToValueAtTime(.0001, when + dur + 1.4);
      g.connect(tone);
      const partials = [[1, 1], [2, .32], [3, .13], [4.01, .05], [.5, .06]];
      for (const [ratio, amp] of partials) {
        const o = ctx.createOscillator();
        o.type = ratio === 1 ? 'triangle' : 'sine';
        o.frequency.value = f * ratio;
        if (ratio === 2) o.detune.value = 3;
        const pg = ctx.createGain(); pg.gain.value = amp * (ratio === 1 ? .55 : 1);
        o.connect(pg); pg.connect(g);
        o.start(when); o.stop(when + dur + 1.6);
      }
    }
    return { master, note };
  }

  function play(overlay, { onDone }) {
    const stage = overlay.querySelector('.intro-stage');
    const gate = overlay.querySelector('.intro-gate');
    const caption = overlay.querySelector('#intro-caption');
    const live = overlay.querySelector('#intro-live');
    const title = overlay.querySelector('#intro-title');
    const scenes = overlay.querySelectorAll('.scene');
    gate.hidden = true;
    stage.hidden = false;

    let ctx, piano;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      piano = makePiano(ctx);
    } catch { ctx = null; }
    const startAt = (ctx ? ctx.currentTime : performance.now() / 1000) + 0.12;
    if (ctx) {
      try { ctx.resume?.()?.catch?.(() => {}); } catch {}
      piano.master.gain.setValueAtTime(0.0001, startAt);
      piano.master.gain.exponentialRampToValueAtTime(.8, startAt + .6);
      for (const [t, n, d, v] of bass) piano.note(startAt + t, N[n], d, v);
      for (const [t, n, d, v] of melody) piano.note(startAt + t, N[n], d, v);
    }
    const now = () => (ctx ? ctx.currentTime : performance.now() / 1000) - startAt;

    let index = 0, raf, finished = false;
    function setScene(id) {
      for (const s of scenes) s.classList.toggle('active', s.dataset.scene === id);
    }
    function setCaption(text) {
      caption.classList.remove('show');
      if (!text) return;
      // 讓淡出先走一小段，再換字淡入
      setTimeout(() => { caption.textContent = text; live.textContent = text; caption.classList.add('show'); }, 180);
    }
    function finish(skipped) {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(raf);
      if (ctx) {
        const t = ctx.currentTime;
        piano.master.gain.cancelScheduledValues(t);
        piano.master.gain.setValueAtTime(piano.master.gain.value || .8, t);
        piano.master.gain.exponentialRampToValueAtTime(.0001, t + (skipped ? .5 : 2.2));
        setTimeout(() => ctx.close?.(), skipped ? 700 : 2600);
      }
      overlay.classList.add('leaving');
      setTimeout(() => { overlay.remove(); onDone?.(); }, 1600);
    }
    function tick() {
      const t = now();
      while (index < timeline.length && timeline[index].t <= t) {
        const step = timeline[index++];
        if (step.scene) setScene(step.scene);
        if ('caption' in step) setCaption(step.caption);
        if (step.title) { setCaption(''); title.classList.add('show'); }
        if (step.end) { finish(false); return; }
      }
      raf = requestAnimationFrame(tick);
    }
    setScene('1');
    raf = requestAnimationFrame(tick);
    overlay.querySelector('#intro-skip').addEventListener('click', () => finish(true));
    document.addEventListener('visibilitychange', () => { if (document.hidden && !finished) finish(true); }, { once: true });
  }

  function mount({ auto }) {
    if (document.getElementById('intro')) return;
    const overlay = buildOverlay();
    document.body.prepend(overlay);
    document.documentElement.classList.add('intro-open');
    const done = () => { document.documentElement.classList.remove('intro-open'); };
    overlay.querySelector('#intro-start').addEventListener('click', () => play(overlay, { onDone: done }));
    overlay.querySelector('#intro-skip-gate').addEventListener('click', () => { overlay.classList.add('leaving'); setTimeout(() => { overlay.remove(); done(); }, 600); });
    if (!auto) overlay.querySelector('#intro-start').focus?.({ preventScroll: true });
  }

  // 每次打開都先看到入口；「直接去找牠」可以跳過，頁尾也有「再看一次開場」。
  if (!reduced) mount({ auto: true });
  const replay = document.getElementById('intro-replay');
  if (replay) replay.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'auto' }); mount({ auto: false }); });
})();

</script>
