<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e9">
  <title>黑醬・在身邊｜開場預覽</title>
  <style>
    :root{color-scheme:light;--paper:#f4f0e9;--ink:#483d35;--warm:#886955;--quiet:#8b7d71;--line:#dcd2c6;--serif:"Songti TC","Noto Serif TC","PMingLiU",serif;--body:"PingFang TC","Microsoft JhengHei",sans-serif}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--body);-webkit-font-smoothing:antialiased}
    main{max-width:550px;margin:auto;padding:40px 25px;text-align:center}
    h1{font:400 30px/1.6 var(--serif);letter-spacing:.05em;margin:40px 0 16px}
    p{color:#7e7165;font-size:13px;letter-spacing:.05em}
    .quiet-button{font:12px var(--body);color:var(--warm);border:1px solid var(--line);border-radius:100px;background:transparent;min-height:42px;padding:10px 18px;cursor:pointer;margin-top:24px}
  </style>
  <link rel="stylesheet" href="intro.css">
  <script>try{document.documentElement.classList.add('intro-open');setTimeout(function(){if(!document.getElementById('intro'))document.documentElement.classList.remove('intro-open')},4000)}catch(e){}</script>
</head>
<body>
  <main>
    <h1>想黑醬的時候，<br>就來這裡。</h1>
    <p>這裡是預覽用的空頁面。<br>正式版開場結束後，會接到黑醬的 AR 頁面。</p>
    <button id="intro-replay" class="quiet-button">再看一次開場</button>
  </main>
  <script defer src="intro.js"></script>
</body>
</html>
